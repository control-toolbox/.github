name: Feature request
description: Suggest an idea for this project
title: "[Feature] "
labels: ["feature"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is concerned?
      options:
        - CTBase
        - CTModels
        - CTSolvers
        - CTDirect
        - CTFlows
        - CTParser
        - CTLie
        - OptimalControl
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
